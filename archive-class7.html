    var roster = document.getElementById("roster");

    STUDENTS.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "stu" + (s.locked ? " locked" : "");
      row.innerHTML =
        '<div><span class="name">' + s.name + '</span> ' +
        '<span class="meta">生日 ' + s.birth + ' · ' + s.dorm + '</span></div>' +
        '<div class="meta">' + (s.locked ? "已加密" : "可查阅") + '</div>';
      roster.appendChild(row);

      if (s.locked) {
        var box = document.createElement("div");
        box.className = "lockbox";
        box.innerHTML =
          '<label>该档案已加密，请输入授权口令：</label><br>' +
          '<input type="text" id="heKey" placeholder="口令" autocomplete="off">' +
          '<button type="button" id="heBtn">调阅</button>' +
          '<div class="lock-msg" id="heMsg"></div>';
        roster.appendChild(box);
        row.addEventListener("click", function () {
          box.classList.toggle("open");
          if (box.classList.contains("open")) document.getElementById("heKey").focus();
        });
        document.getElementById("heBtn").addEventListener("click", function () {
          var v = document.getElementById("heKey").value.trim();
          var m = document.getElementById("heMsg");
          if (v === "20060609") {
            m.textContent = "口令正确，档案已解密。"; m.className = "lock-msg ok";
            openDetail(s, row);
            box.classList.remove("open");
            row.classList.remove("locked");
          } else {
            m.textContent = "口令错误，无法调阅。"; m.className = "lock-msg err";
          }
        });
      } else {
        var detail = document.createElement("div");
        detail.className = "detail";
        detail.innerHTML =

          '<div class="clue">备注：' + s.note + '</div>';
        roster.appendChild(detail);
        row.addEventListener("click", function () { detail.classList.toggle("open"); });

    function openDetail(s, row) {
      var detail = document.createElement("div");
      detail.className = "detail open";
      detail.innerHTML =
        '<div class="field"><span class="k">姓名</span><span class="v">' + s.name + '</span></div>' +

        '<div class="field"><span class="k">生日</span><span class="v">' + s.birth + '</span></div>' +
        '<div class="field"><span class="k">宿舍</span><span class="v">' + s.dorm + '</span></div>' +
        '<div class="field"><span class="k">去向</span><span class="v">' + s.goal + '</span></div>' +
        '<div class="mark-seal">' + symSVG(s.sym) + '</div>' +
        '<div class="clue">备注：' + s.note + '</div>' +
        (s.bio ? '<div class="bio-block"><div class="bio-h">生前概况 · 死亡原因（解密档案）</div><div class="bio-t">' + s.bio + '</div></div>' : '');
      row.parentNode.insertBefore(detail, row.nextSibling);
